name: update-calendar
on:
  schedule:
    - cron: "23 * * * *"   # hourly; off-minute to dodge the :00 GitHub rush
  workflow_dispatch:
  push:  # TEMP: e2e test on feature branch, removed before merge
    branches: [claude/mexico-womens-ics-feed-upbuqo]

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch fixtures and render ICS
        run: |
          python3 fetch.py
          python3 ics.py
      - name: "TEMP: verify idempotence (second run must be a no-op)"
        run: |
          git add -N docs/
          git diff -- docs/ > /tmp/first.diff
          python3 fetch.py
          python3 ics.py
          git diff -- docs/ > /tmp/second.diff
          diff /tmp/first.diff /tmp/second.diff && echo "idempotent: OK"
      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "Update fixtures $(date -u +%F)"
          git push
